<html>
    <head>
        <title>Registration Form></title>
    </head>
    <body>
        <h1 align="center">Registration Form</h1>
        <form>
           Name:<input type="text" name="uname"><br>
            Email:<input type="email" name="uemail"><br>
            Phone number:<input type="number" size="20" name="uphno"><br>
            Date:<input type="date" name="date"><br>
            Age:<input type="number" name="uage"><br>
            Gender:<input type="radio" name="male">Male<br>
            <input type="radio" name="male">Female<br>
            Hobbies:<input type="checkbox" name="hobbies">Singing<br>
            <input type="checkbox" name="hobbies">Dancing<br>
            <input type="checkbox" name="hobbies">Reading<br>
            <input type="checkbox" name="hobbies">Sleeping<br>
            <input type="submit" name="submit">
            <input type="reset" name="reset">

        </form>
    </body>
</html>
